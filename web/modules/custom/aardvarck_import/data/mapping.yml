# Aardvarck import — taxonomy term mapping & translation table.
#
# This file is the single source of truth for how raw YAML values from the
# portfolio import packages (see ./IMPORT in the project root) are resolved
# to taxonomy terms.
#
# There are two kinds of sections:
#
# 1. Translatable vocabularies (work_medium, work_technique,
#    academy_program): a list of nl/en pairs. The raw value found in the
#    import YAML is always the ENGLISH ("en") value — the importer looks up
#    the raw value under "en" and uses the matching "nl" value as the term's
#    canonical (source language) name, adding "en" as its English
#    translation.
#
# 2. Non-translatable vocabularies (academy_name, academy_year,
#    academy_study_year, academy_teacher): a flat list of strings. The value
#    is used as-is, identical in both languages, no translation needed.
#
# Values not found here are NOT a fatal error: the importer still creates
# the work and the term (using the raw value verbatim), but flags it on the
# import report for manual review — add the missing entry here afterwards.
#
# Keep this file in sync with ./IMPORT/structure.yml (the data owner
# maintains the enum values there; this file adds the Dutch translations).

