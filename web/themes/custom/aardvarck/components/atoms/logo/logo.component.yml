$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Logo
description: Brand logo
group: Atoms
props:
  type: object
  properties:
    orientation:
      title: Orientation
      type: string
      enum:
        - horizontal
        - vertical
      default: horizontal
    variant:
      title: Variant
      type: string
      enum:
        - primary
        - secondary
        - black
        - white
      default: primary
    size:
       title: Size
       type: string
       enum:
         - small
         - medium
         - large
         - huge
       default: medium
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
      default: {}
    url:
      type: ['string', 'null']
      title: URL
      description: Optional url to create a link.
      default: null
slots:
  title:
    title: Title
